[package]
name = "lsm303dlhc-registers"
version = "0.1.4"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
categories = ["embedded", "hardware-support", "no-std", "science::robotics"]
description = "A typed map of the STMicroelectronics LSM303DLHC E-Compass registers"
keywords = ["embedded-hal", "lsm303dlhc", "mems", "i2c", "registers"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
homepage = "https://github.com/sunsided/lsm303dlhc-registers"
repository = "https://github.com/sunsided/lsm303dlhc-registers"
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[features]
defmt = ["dep:defmt"]

[lints.clippy]
# Modules live in `folder.rs` plus `folder/`, never in `folder/mod.rs`.
mod_module_files = "deny"

[dependencies]
bitfield-struct = "0.13.0"
defmt = { version = "1.0.1", optional = true }
hardware-registers = "0.4.0"

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/lsm303dlhc-registers/releases/tag/v{{version}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
